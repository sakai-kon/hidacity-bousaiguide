name: Fix home hero image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-home-hero.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace mountain SVG with photo
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('          <div class="hero-visual">\n')
          if start == -1:
              raise SystemExit('hero visual start not found')
          end_marker = '          </div>\n        </div>\n      </div>\n    </section>'
          end = s.find(end_marker, start)
          if end == -1:
              raise SystemExit('hero visual end not found')
          replacement = ('          <div class="hero-visual">\n'
                         '            <img src="/hidacity-bousaiguide/images/hero/castle-photo.svg?v=2026-08-30-photo" '
                         'alt="飛騨防災ガイドのヒーロー写真" loading="eager" decoding="async">\n'
                         '          </div>\n')
          s = s[:start] + replacement + '        </div>\n      </div>\n    </section>' + s[end + len(end_marker):]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Remove temporary fixer workflow from main
        shell: bash
        run: rm -f .github/workflows/fix-home-hero.yml

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-home-hero.yml
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "fix: use photo hero on home page"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; sleep 2; continue; }
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
