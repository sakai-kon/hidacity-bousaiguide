name: Build article and search indexes

on:
  push:
    branches: [main]
    paths:
      - 'articles/**/*.txt'
      - 'scripts/build_articles.py'
      - '.github/workflows/build-articles.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build article and search indexes
        run: python scripts/build_articles.py

      - name: Commit generated indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/articles.json search/site-search.json
          if git diff --cached --quiet; then
            echo "No generated index changes."
          else
            git commit -m "chore: update article and search indexes"
            git push
          fi
