name: Build article and search indexes

on:
  push:
    branches: [main]
    paths:
      - 'articles/**/*.txt'
      - 'scripts/build_articles.py'
      - '.github/workflows/build-articles.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build article and search indexes
        run: python scripts/build_articles.py

      - name: Commit generated indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/articles.json search/site-search.json
          if git diff --cached --quiet; then
            echo "No generated index changes."
            exit 0
          fi

          git commit -m "chore: update article and search indexes"

          # The workflow may race with another push to main. Rebase the
          # generated commit onto the newest main before pushing.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              echo "Rebase conflict; generated indexes need to be rebuilt on the latest main."
              git rebase --abort || true
              git reset --hard origin/main
              python scripts/build_articles.py
              git add articles/articles.json search/site-search.json
              if git diff --cached --quiet; then
                echo "Generated indexes are already up to date."
                exit 0
              fi
              git commit -m "chore: update article and search indexes"
            fi
            echo "Push race detected; retrying ($attempt/5)..."
            sleep 2
          done

          echo "Failed to push generated indexes after 5 attempts."
          exit 1
