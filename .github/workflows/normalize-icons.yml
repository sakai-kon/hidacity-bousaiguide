name: Normalize icon references

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace legacy icon references
        shell: bash
        run: |
          set -euo pipefail
          NEW='/hidacity-bousaiguide/assets/icons/hida-bousai-icon.png'
          find . -type f \( -name '*.html' -o -name '*.js' -o -name '*.json' -o -name '*.webmanifest' \) -not -path './.git/*' -print0 |
          while IFS= read -r -d '' file; do
            sed -i \
              -e "s#/hidacity-bousaiguide/favicon\\.svg#$NEW#g" \
              -e "s#/hidacity-bousaiguide/icons/icon-192\\.png#$NEW#g" \
              -e "s#/hidacity-bousaiguide/icons/icon-512\\.png#$NEW#g" \
              -e "s#/hidacity-bousaiguide/assets/icons/hida-bousai-icon\\.svg#$NEW#g" \
              "$file"
          done
      - name: Commit normalized references
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Normalize all icon references to uploaded PNG'
          git push
