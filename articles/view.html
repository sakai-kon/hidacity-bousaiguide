<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>記事｜飛騨防災ガイド</title><meta name="description" content="飛騨防災ガイド 防災記事"><link rel="stylesheet" href="/hidacity-bousaiguide/assets/css/global.css"><link rel="stylesheet" href="/hidacity-bousaiguide/assets/css/ui-refresh.css?v=2026-08-20-ui2"><style>.article-body{max-width:820px;margin:0 auto;font-size:17px;line-height:2;color:var(--ink-muted)}.article-body p{margin:0 0 1.2em}.article-title{max-width:900px}</style></head><body><header class="site-header"><div class="header-inner"><a href="/hidacity-bousaiguide/" class="logo"><span class="logo-badge">⚡</span><span>飛騨防災ガイド<span class="logo-sub">防災探究サイト</span></span></a><nav class="pc-nav"><a href="/hidacity-bousaiguide/" class="nav-link">トップ</a><a href="/hidacity-bousaiguide/hazard/" class="nav-link">ハザードマップ</a><a href="/hidacity-bousaiguide/articles/" class="nav-link is-active">防災記事</a></nav><div class="header-actions"><button class="icon-btn" data-theme-toggle aria-label="ダークモードの切り替え"><span class="icon-moon">☾</span><span class="icon-sun">☀</span></button></div></div></header><main><section class="page-hero"><div class="page-hero-inner"><p class="breadcrumb"><a href="/hidacity-bousaiguide/articles/">防災記事</a> / 記事</p><span class="eyebrow">📄 防災記事</span><h1 id="title" class="section-title article-title">記事を読み込んでいます…</h1></div></section><section class="section"><div class="container"><article id="body" class="article-body">読み込んでいます…</article><div class="text-center mt-4"><a class="btn btn-outline" href="./">← 記事一覧へ戻る</a></div></div></section></main><script type="module" src="/hidacity-bousaiguide/assets/js/common.js"></script><script type="module" src="/hidacity-bousaiguide/assets/js/pwa.js"></script><script>
const API='https://api.github.com/repos/sakai-kon/hidacity-bousaiguide/contents/articles?ref=main';
(async()=>{const p=new URLSearchParams(location.search);const slug=p.get('slug');const title=document.getElementById('title'),body=document.getElementById('body');if(!slug){title.textContent='記事が指定されていません';body.textContent='記事一覧から記事を選択してください。';return;}try{let article=null;const mr=await fetch('./articles.json?v='+Date.now(),{cache:'no-store'});if(mr.ok){const list=await mr.json();article=list.find(a=>a.slug===slug)||null;}if(!article){const dir=await fetch(API,{cache:'no-store'});if(!dir.ok)throw Error('記事一覧を取得できませんでした');const files=(await dir.json()).filter(x=>x.type==='file'&&x.name.toLowerCase().endsWith('.txt')&&!x.name.startsWith('_'));const file=files.find(x=>x.name.replace(/\.txt$/i,'')===slug);if(file)article={title:file.name.replace(/\.txt$/i,''),file:file.name,download_url:file.download_url};}if(!article)throw Error('記事が見つかりません');const url=article.download_url||('../articles/'+article.file.split('/').map(encodeURIComponent).join('/'));const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('記事本文 HTTP '+r.status);const text=await r.text();const lines=text.replace(/\r/g,'').split('\n');if(/^#\s+/.test(lines[0])){title.textContent=lines[0].replace(/^#\s+/,'').trim();}else{title.textContent=article.title;}const start=/^#\s+/.test(lines[0])?1:0;body.replaceChildren(...lines.slice(start).join('\n').split(/\n\s*\n/).filter(x=>x.trim()).map(x=>{const el=document.createElement('p');el.textContent=x.trim();return el;}));document.title=title.textContent+'｜飛騨防災ガイド';}catch(e){title.textContent='記事を表示できませんでした';body.textContent=e.message;}})();
</script></body></html>
