function escText(v){return String(v)}
(async()=>{const p=new URLSearchParams(location.search);const slug=p.get('slug');const title=document.getElementById('title'),body=document.getElementById('body');if(!slug){title.textContent='記事が指定されていません';body.textContent='記事一覧から記事を選択してください。';return;}try{const mr=await fetch('./articles.json?v='+Date.now(),{cache:'no-store'});if(!mr.ok)throw Error('記事一覧を取得できませんでした');const list=await mr.json();const article=list.find(a=>a.slug===slug);if(!article)throw Error('記事が見つかりません');const r=await fetch('../articles/'+encodeURIComponent(article.file),{cache:'no-store'});if(!r.ok)throw Error('記事本文 HTTP '+r.status);const text=await r.text();const lines=text.replace(/\r/g,'').split('\n');let start=0;if(/^#\s+/.test(lines[0])){title.textContent=lines[0].replace(/^#\s+/,'').trim();start=1;}else{title.textContent=article.title;}body.replaceChildren(...lines.slice(start).join('\n').split(/\n\s*\n/).filter(p=>p.trim()).map(p=>{const el=document.createElement('p');el.textContent=p.trim();return el;}));document.title=title.textContent+'｜飛騨防災ガイド';}catch(e){title.textContent='記事を表示できませんでした';body.textContent=e.message;}})();
</script></body></html>
