ll="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button></div></div><nav class="mobile-menu" data-mobile-menu aria-label="モバイルメニュー"><a href="/hidacity-bousaiguide/" class="nav-link">トップ</a><a href="/hidacity-bousaiguide/hazard/" class="nav-link">避難場所・ハザードマップ</a><a href="/hidacity-bousaiguide/bag/" class="nav-link">持ち物チェック</a><a href="/hidacity-bousaiguide/knowledge/" class="nav-link">防災知識</a><a href="/hidacity-bousaiguide/quiz/" class="nav-link">防災クイズ</a><a href="/hidacity-bousaiguide/articles/" class="nav-link is-active">防災記事</a><a href="/hidacity-bousaiguide/contact/" class="nav-link">お問い合わせ</a></nav></header><main><section class="page-hero"><div class="page-hero-inner"><p class="breadcrumb"><a href="/hidacity-bousaiguide/articles/">防災記事</a> / 記事</p><span class="eyebrow">📄 防災記事</span><h1 id="title" class="section-title">記事を読み込んでいます…</h1><div id="meta" class="article-meta"></div></div></section><section class="section"><div class="container"><article id="body" class="article-content">読み込んでいます…</article><div class="text-center mt-4"><a class="btn btn-outline" href="./">← 記事一覧へ戻る</a></div></div></section></main><script type="module" src="/hidacity-bousaiguide/assets/js/common.js"></script><script type="module" src="/hidacity-bousaiguide/assets/js/pwa.js"></script><script>const q=new URLSearchParams(location.search),slug=q.get('slug');const titleEl=document.getElementById('title'),bodyEl=document.getElementById('body'),metaEl=document.getElementById('meta');function addText(text){const p=document.createElement('p');p.textContent=text;bodyEl.appendChild(p);}function renderMarkdown(text){bodyEl.replaceChildren();let list=null;for(const raw of text.replace(/\r/g,'').split('\n')){const line=raw.trimEnd();if(!line.trim()){list=null;continue;}if(/^###\s+/.test(line)){list=null;const h=document.createElement('h3');h.textContent=line.replace(/^###\s+/,'');bodyEl.appendChild(h);continue;}if(/^##\s+/.test(line)){list=null;const h=document.createElement('h2');h.textContent=line.replace(/^##\s+/,'');bodyEl.appendChild(h);continue;}if(/^-\s+/.test(line)){if(!list){list=document.createElement('ul');bodyEl.appendChild(list);}const li=document.createElement('li');li.textContent=line.replace(/^-\s+/,'');list.appendChild(li);continue;}list=null;addText(line);}}(async()=>{if(!slug){titleEl.textContent='記事が指定されていません';bodyEl.textContent='記事一覧から記事を選択してください。';return;}try{const r=await fetch('./articles.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('記事一覧 HTTP '+r.status);const list=await r.json();const item=list.find(x=>x.slug===slug);if(!item)throw Error('記事が見つかりません');titleEl.textContent=item.title;document.title=item.title+'｜飛騨防災ガイド';if(item.category)metaEl.append(document.createTextNode('🏷 '+item.category));if(item.date)metaEl.append(document.createTextNode((metaEl.childNodes.length?'  ·  ':'')+'📅 '+item.date));if(item.readingMinutes)metaEl.append(document.createTextNode((metaEl.childNodes.length?'  ·  ':'')+'📖 約'+item.readingMinutes+'分'));const textRes=await fetch('../'+encodeURI('articles/'+item.file)+'?v='+Date.now(),{cache:'no-store'});if(!textRes.ok)throw Error('記事本文 HTTP '+textRes.status);let text=await textRes.text();text=text.replace(/^(---\n[\s\S]*?\n---\n)/,'').replace(/^#\s+.*\n?/,'');renderMarkdown(text);}catch(e){titleEl.textContent='記事を表示できませんでした';bodyEl.textContent=e.message;}})();</script></body></html>
