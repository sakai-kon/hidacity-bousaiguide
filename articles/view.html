<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>記事｜飛騨防災ガイド</title><meta name="description" content="飛騨防災ガイド 防災記事"><link rel="stylesheet" href="/hidacity-bousaiguide/assets/css/global.css"><link rel="stylesheet" href="/hidacity-bousaiguide/assets/css/ui-refresh.css?v=2026-08-20-ui2"><link rel="stylesheet" href="/hidacity-bousaiguide/assets/css/site-search.css?v=2026-08-20-search2"></head><body><header class="site-header"><div class="header-inner"><a href="/hidacity-bousaiguide/" class="logo"><span class="logo-badge">⚡</span><span>飛騨防災ガイド<span class="logo-sub">防災探究サイト</span></span></a><nav class="pc-nav"><a href="/hidacity-bousaiguide/" class="nav-link">トップ</a><a href="/hidacity-bousaiguide/hazard/" class="nav-link">ハザードマップ</a><a href="/hidacity-bousaiguide/articles/" class="nav-link is-active">防災記事</a></nav><div class="header-actions"><button class="icon-btn" data-theme-toggle aria-label="ダークモードの切り替え">☾</button></div></div></header><main><section class="page-hero"><div class="page-hero-inner"><p class="breadcrumb"><a href="/hidacity-bousaiguide/articles/">防災記事</a> / 記事</p><span class="eyebrow">📄 防災記事</span><h1 id="title" class="section-title">記事を読み込んでいます…</h1><div id="meta" class="article-meta"></div></div></section><section class="section"><div class="container"><article id="body" class="article-content">読み込んでいます…</article><div class="text-center mt-4"><a class="btn btn-outline" href="./">← 記事一覧へ戻る</a></div></div></section></main><script type="module" src="/hidacity-bousaiguide/assets/js/common.js"></script><script type="module" src="/hidacity-bousaiguide/assets/js/pwa.js"></script><script>
const q=new URLSearchParams(location.search),slug=q.get('slug');const titleEl=document.getElementById('title'),bodyEl=document.getElementById('body'),metaEl=document.getElementById('meta');
function addText(text){const p=document.createElement('p');p.textContent=text;bodyEl.appendChild(p);}
function renderMarkdown(text){bodyEl.replaceChildren();let list=null;for(const raw of text.replace(/\r/g,'').split('\n')){const line=raw.trimEnd();if(!line.trim()){list=null;continue;}if(/^###\s+/.test(line)){list=null;const h=document.createElement('h3');h.textContent=line.replace(/^###\s+/,'');bodyEl.appendChild(h);continue;}if(/^##\s+/.test(line)){list=null;const h=document.createElement('h2');h.textContent=line.replace(/^##\s+/,'');bodyEl.appendChild(h);continue;}if(/^-\s+/.test(line)){if(!list){list=document.createElement('ul');bodyEl.appendChild(list);}const li=document.createElement('li');li.textContent=line.replace(/^-\s+/,'');list.appendChild(li);continue;}list=null;addText(line);}}
(async()=>{if(!slug){titleEl.textContent='記事が指定されていません';bodyEl.textContent='記事一覧から記事を選択してください。';return;}try{const r=await fetch('./articles.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('記事一覧 HTTP '+r.status);const list=await r.json();const item=list.find(x=>x.slug===slug);if(!item)throw Error('記事が見つかりません');titleEl.textContent=item.title;document.title=item.title+'｜飛騨防災ガイド';if(item.category)metaEl.append(document.createTextNode('🏷 '+item.category));if(item.date)metaEl.append(document.createTextNode((metaEl.childNodes.length?'  ·  ':'')+'📅 '+item.date));if(item.readingMinutes)metaEl.append(document.createTextNode((metaEl.childNodes.length?'  ·  ':'')+'📖 約'+item.readingMinutes+'分'));const textRes=await fetch('../'+encodeURI('articles/'+item.file)+'?v='+Date.now(),{cache:'no-store'});if(!textRes.ok)throw Error('記事本文 HTTP '+textRes.status);let text=await textRes.text();text=text.replace(/^(---\n[\s\S]*?\n---\n)/,'').replace(/^#\s+.*\n?/,'');renderMarkdown(text);}catch(e){titleEl.textContent='記事を表示できませんでした';bodyEl.textContent=e.message;}})();
</script></body></html>
