<main><section class="page-hero"><div class="page-hero-inner"><p class="breadcrumb"><a href="/hidacity-bousaiguide/">トップ</a> / 防災記事</p><span class="eyebrow">✍️ 防災をもっと知る</span><h1 class="section-title">防災記事</h1><p class="section-lead">防災について調べたことや、地域の災害についての記事をまとめています。新しい記事はGitHubの <code>articles/</code> フォルダに `.txt` を追加するだけで公開できます。</p></div></section>
<section class="section"><div class="container"><div id="status" class="notice is-blue">記事一覧を読み込んでいます…</div><div id="article-list" class="grid grid-2 mt-3"></div></div></section></main>
<script type="module" src="/hidacity-bousaiguide/assets/js/common.js"></script><script type="module" src="/hidacity-bousaiguide/assets/js/pwa.js"></script>
<script>
(async()=>{const list=document.getElementById('article-list'),status=document.getElementById('status');try{const r=await fetch('./articles.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('articles.json HTTP '+r.status);const articles=await r.json();if(!articles.length){status.textContent='まだ記事はありません。articles フォルダに .txt ファイルを追加してください。';return;}status.remove();for(const a of articles){const el=document.createElement('a');el.href='./view.html?slug='+encodeURIComponent(a.slug);el.className='solid-card';el.style.display='block';el.innerHTML='<span class="tag tag-blue">防災記事</span><h2 class="card-title mt-2"></h2><p class="text-muted text-sm mt-1"></p><span class="text-sm" style="color:var(--orange-dark);font-weight:700;display:inline-block;margin-top:14px">記事を読む →</span>';el.querySelector('h2').textContent=a.title;el.querySelector('p').textContent=a.excerpt||'防災についての記事です。';list.appendChild(el);}}catch(e){status.classList.remove('is-blue');status.classList.add('error');status.textContent='記事一覧の読み込みに失敗しました：'+e.message;}})();
</script></body></html>
