<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>防災記事｜飛騨防災ガイド</title><meta name="description" content="飛騨市の防災について調べたことを記事として紹介します。"><link rel="stylesheet" href="/hidacity-bousaiguide/assets/css/global.css"><link rel="stylesheet" href="/hidacity-bousaiguide/assets/css/ui-refresh.css?v=2026-08-20-ui2"><link rel="stylesheet" href="/hidacity-bousaiguide/assets/css/site-search.css?v=2026-08-20-search2"></head><body><header class="site-header"><div class="header-inner"><a href="/hidacity-bousaiguide/" class="logo"><span class="logo-badge">⚡</span><span>飛騨防災ガイド<span class="logo-sub">防災探究サイト</span></span></a><nav class="pc-nav"><a href="/hidacity-bousaiguide/" class="nav-link">トップ</a><a href="/hidacity-bousaiguide/hazard/" class="nav-link">ハザードマップ</a><a href="/hidacity-bousaiguide/bag/" class="nav-link">持ち物</a><a href="/hidacity-bousaiguide/knowledge/" class="nav-link">防災知識</a><a href="/hidacity-bousaiguide/quiz/" class="nav-link">クイズ</a><a href="/hidacity-bousaiguide/articles/" class="nav-link is-active">防災記事</a></nav><div class="header-actions"><button class="icon-btn" data-theme-toggle aria-label="ダークモードの切り替え">☾</button></div></div></header><main><section class="page-hero"><div class="page-hero-inner"><p class="breadcrumb"><a href="/hidacity-bousaiguide/">トップ</a> / 防災記事</p><span class="eyebrow">✍️ 防災をもっと知る</span><h1 class="section-title">防災記事</h1><p class="section-lead">防災について調べたことや、地域の災害についての記事をまとめています。</p></div></section><section class="section"><div class="container"><div class="article-filterbar"><div id="categories" class="article-filterbar"></div><select id="sort" class="article-sort" aria-label="記事の並び順"><option value="new">新しい順</option><option value="old">古い順</option><option value="title">タイトル順</option></select></div><div id="status" class="notice is-blue mt-3">記事一覧を読み込んでいます…</div><div id="article-list" class="grid grid-2 mt-3"></div></div></section></main><script type="module" src="/hidacity-bousaiguide/assets/js/common.js"></script><script type="module" src="/hidacity-bousaiguide/assets/js/pwa.js"></script><script>
const BASE='/hidacity-bousaiguide';const listEl=document.getElementById('article-list'),statusEl=document.getElementById('status'),catsEl=document.getElementById('categories'),sortEl=document.getElementById('sort');let articles=[];let category='すべて';
function isNew(date){if(!date)return false;const d=new Date(date+'T00:00:00');return (Date.now()-d.getTime())<=7*86400000;}
function render(){let data=articles.filter(a=>category==='すべて'||a.category===category);const sort=sortEl.value;if(sort==='new')data.sort((a,b)=>(b.date||'').localeCompare(a.date||''));else if(sort==='old')data.sort((a,b)=>(a.date||'').localeCompare(b.date||''));else data.sort((a,b)=>a.title.localeCompare(b.title,'ja'));listEl.replaceChildren();if(!data.length){listEl.innerHTML='<div class="article-empty" style="grid-column:1/-1">該当する記事はありません。</div>';return;}for(const a of data){const card=document.createElement('a');card.className='solid-card';card.style.display='block';card.href='./view.html?slug='+encodeURIComponent(a.slug);card.innerHTML='<span class="tag tag-blue">'+escapeHtml(a.category||'防災')+'</span>'+ (isNew(a.date)?'<span class="article-new">NEW</span>':'')+'<h2 class="card-title mt-2"></h2><p class="text-muted text-sm mt-1"></p><div class="article-card-meta"></div>';card.querySelector('h2').textContent=a.title;card.querySelector('p').textContent=a.description||a.excerpt||'';const m=card.querySelector('.article-card-meta');if(a.date)m.append(document.createTextNode('📅 '+a.date));if(a.readingMinutes)m.append(document.createTextNode((a.date?'  ·  ':'')+'📖 約'+a.readingMinutes+'分'));listEl.appendChild(card);}}
function escapeHtml(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
(async()=>{try{const r=await fetch('./articles.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);articles=await r.json();const cats=['すべて',...new Set(articles.map(a=>a.category||'防災'))];for(const c of cats){const b=document.createElement('button');b.className='article-filter'+(c===category?' is-active':'');b.textContent=c;b.addEventListener('click',()=>{category=c;document.querySelectorAll('.article-filter').forEach(x=>x.classList.toggle('is-active',x===b));render();});catsEl.appendChild(b);}statusEl.remove();render();}catch(e){statusEl.classList.remove('is-blue');statusEl.classList.add('error');statusEl.textContent='記事一覧の読み込みに失敗しました：'+e.message;}})();sortEl.addEventListener('change',render);
</script></body></html>
